services:
  openinsider:
    build: .
    environment:
      - POLL_INTERVAL_HOURS=${POLL_INTERVAL_HOURS:-4}
      - MIN_EXECUTIVES=${MIN_EXECUTIVES:-3}
      - MIN_TRANSACTION_VALUE=${MIN_TRANSACTION_VALUE:-200000}
      - LOOKBACK_DAYS=${LOOKBACK_DAYS:-7}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DEDUP_STATE_PATH=/data/alert_state.json
    volumes:
      - openinsider_data:/data
    restart: unless-stopped

  backtest:
    build: .
    command: >
      streamlit run backtest_app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    volumes:
      - backtest_cache:/app/.cache
    restart: unless-stopped
    profiles: ["backtest"]

volumes:
  openinsider_data:
  backtest_cache:
